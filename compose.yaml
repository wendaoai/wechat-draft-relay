services:
  relay:
    image: ${WECHAT_DRAFT_IMAGE:-wechat-draft-relay:local}
    build: .
    ports:
      - "${WECHAT_DRAFT_BIND:-127.0.0.1:8201}:8201"
    volumes:
      - relay-state:/state
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8201/readyz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  relay-state:
